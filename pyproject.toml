[project]
name = "slack-agent-hub"
version = "0.1.0"
description = "Federated Slack-to-CLI-agent bridge"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.21.0",
    "slack-sdk>=3.33.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["core", "backends", "features", "slack_io", "storage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
